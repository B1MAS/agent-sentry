name: AgentSentry
on:
  pull_request:
  push:
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AgentSentry
        run: python -m pip install .
      - name: Scan agent surface
        run: agent-sentry scan . --format sarif --fail-on high > agent-sentry.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: agent-sentry.sarif
